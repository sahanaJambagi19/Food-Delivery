<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment — FoodExpress</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
<nav class="navbar navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" style="color:var(--primary)" href="index.html"><img class="brand-logo" src="images/foodexpress-logo.svg" alt=""> <span>FoodExpress</span></a>
        <span class="fw-semibold"><i class="bi bi-lock-fill me-1"></i>Secure Payment</span>
    </div>
</nav>

<div class="container my-4" style="max-width:900px">
    <div id="alertBox" style="display:none" class="mb-3"></div>

    <div class="row g-4">
        <!-- Payment methods -->
        <div class="col-md-7">
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <h6 class="fw-bold mb-3">Choose payment method</h6>
                    <div id="demoBanner" class="alert alert-warning py-2 small d-none">
                        <i class="bi bi-info-circle me-1"></i><b>Test mode:</b> no real money is charged. Any details work.
                    </div>

                    <div class="d-flex gap-2 mb-3">
                        <div class="method-tab active flex-fill text-center" data-m="upi" onclick="pickMethod('upi')"><i class="bi bi-phone d-block fs-4"></i>UPI</div>
                        <div class="method-tab flex-fill text-center" data-m="card" onclick="pickMethod('card')"><i class="bi bi-credit-card d-block fs-4"></i>Card</div>
                        <div class="method-tab flex-fill text-center" data-m="netbanking" onclick="pickMethod('netbanking')"><i class="bi bi-bank d-block fs-4"></i>Net Banking</div>
                    </div>

                    <div id="m-upi">
                        <label class="form-label small">UPI ID</label>
                        <input id="upiId" class="form-control" placeholder="name@upi" value="demo@upi">
                    </div>
                    <div id="m-card" class="d-none">
                        <div class="mb-2"><label class="form-label small">Card number</label>
                            <input id="cardNo" class="form-control" placeholder="4111 1111 1111 1111" maxlength="19"></div>
                        <div class="row g-2">
                            <div class="col-6"><label class="form-label small">Expiry</label><input class="form-control" placeholder="MM/YY" maxlength="5"></div>
                            <div class="col-6"><label class="form-label small">CVV</label><input type="password" class="form-control" placeholder="•••" maxlength="4"></div>
                        </div>
                    </div>
                    <div id="m-netbanking" class="d-none">
                        <label class="form-label small">Select bank</label>
                        <select class="form-select"><option>State Bank of India</option><option>HDFC Bank</option><option>ICICI Bank</option><option>Axis Bank</option></select>
                    </div>

                    <button id="payBtn" data-label="Pay" class="btn text-white w-100 mt-4 py-2" style="background:var(--primary)" onclick="pay()">Pay</button>
                    <p class="secure text-center mt-2 mb-0"><i class="bi bi-shield-check me-1"></i>Payments are verified on the server</p>
                </div>
            </div>
            <a href="orders.html" class="btn btn-link mt-2">Pay later from My Orders</a>
        </div>

        <!-- Order summary -->
        <div class="col-md-5">
            <div class="card border-0 shadow-sm">
                <div class="card-body" id="summary">
                    <div class="text-center py-4"><div class="spinner-border text-warning"></div></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="js/app.js"></script>
<script>
    if (!Auth.isLoggedIn()) location.href = 'login.html';

    const orderId = new URLSearchParams(location.search).get('orderId');
    if (!orderId) location.href = 'orders.html';
    let order = null, method = 'upi';

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const money = n => '₹' + Number(n || 0).toFixed(2);

    function pickMethod(m) {
        method = m;
        document.querySelectorAll('.method-tab').forEach(t => t.classList.toggle('active', t.dataset.m === m));
        ['upi', 'card', 'netbanking'].forEach(x => document.getElementById('m-' + x).classList.toggle('d-none', x !== m));
    }

    async function loadOrder() {
        const res = await apiFetch(`/orders/${orderId}`);
        if (!res?.ok) { showAlert('alertBox', res?.data?.message || 'Order not found'); return; }
        order = res.data.data;
        if (order.paymentStatus === 'PAID') { location.href = `order-success.html?id=${order.id}`; return; }
        if (order.paymentMethod === 'COD') { location.href = `order-success.html?id=${order.id}`; return; }

        document.getElementById('payBtn').dataset.label = `Pay ${money(order.totalAmount)}`;
        document.getElementById('payBtn').textContent = `Pay ${money(order.totalAmount)}`;
        const row = (l, v, cls = '') => `<div class="d-flex justify-content-between ${cls}"><span>${l}</span><span>${v}</span></div>`;
        document.getElementById('summary').innerHTML = `
            <h6 class="fw-bold">Order #${esc(order.orderNumber)}</h6>
            <p class="text-muted small mb-3">${esc(order.restaurantName)}</p>
            ${(order.items || []).map(i => row(`${esc(i.name)} × ${i.quantity}`, money(i.totalPrice), 'small mb-1')).join('')}
            <hr>
            ${row('Subtotal', money(order.subtotal), 'small')}
            ${row('Delivery', money(order.deliveryCharge), 'small')}
            ${row('Taxes', money(order.taxAmount), 'small')}
            ${Number(order.discountAmount) > 0 ? row('Discount', '−' + money(order.discountAmount), 'small text-success') : ''}
            <hr>
            ${row('<b>Total</b>', `<b>${money(order.totalAmount)}</b>`)}`;
    }

    async function pay() {
        if (!order) return;
        setLoading('payBtn', true);
        const res = await apiFetch(`/payments/orders/${order.id}/create`, { method: 'POST' });
        if (!res?.ok) {
            setLoading('payBtn', false);
            return showAlert('alertBox', res?.data?.message || 'Payment initiation failed');
        }
        const payment = res.data.data;

        if (payment.demo) {
            document.getElementById('demoBanner').classList.remove('d-none');
            // Simulated gateway: short delay, then confirm on the server.
            await new Promise(r => setTimeout(r, 1200));
            return confirmPayment({
                razorpayOrderId: payment.razorpayOrderId,
                razorpayPaymentId: 'demo_pay_' + Date.now(),
                razorpaySignature: 'demo_signature'
            });
        }

        setLoading('payBtn', false);
        new Razorpay({
            key: payment.razorpayKeyId,
            amount: Math.round(parseFloat(payment.amount) * 100),
            currency: payment.currency,
            name: 'FoodExpress',
            description: 'Order #' + order.orderNumber,
            order_id: payment.razorpayOrderId,
            handler: r => confirmPayment({
                razorpayOrderId: r.razorpay_order_id,
                razorpayPaymentId: r.razorpay_payment_id,
                razorpaySignature: r.razorpay_signature
            }),
            prefill: { name: Auth.getName(), email: localStorage.getItem('userEmail') },
            theme: { color: '#00473C' }
        }).open();
    }

    async function confirmPayment(body) {
        const res = await apiFetch('/payments/verify', { method: 'POST', body: JSON.stringify(body) });
        setLoading('payBtn', false);
        if (res?.ok) location.href = `order-success.html?id=${order.id}`;
        else showAlert('alertBox', res?.data?.message || 'Payment verification failed');
    }

    loadOrder();
</script>
</body>
</html>
