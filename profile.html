<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile — FoodExpress</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" style="color:var(--primary)" href="index.html"><img class="brand-logo" src="images/foodexpress-logo.svg" alt=""> <span>FoodExpress</span></a>
        <span class="fw-semibold">My Profile</span>
    </div>
</nav>

<div class="container my-4" style="max-width:800px">
    <div id="alertBox" style="display:none" class="mb-3"></div>

    <!-- Profile -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <h6 class="fw-bold mb-3"><i class="bi bi-person me-2"></i>Personal details</h6>
            <form id="profileForm" class="row g-3">
                <div class="col-md-6">
                    <label class="form-label small">Name</label>
                    <input id="pName" class="form-control" required minlength="2" maxlength="150">
                </div>
                <div class="col-md-6">
                    <label class="form-label small">Phone</label>
                    <input id="pPhone" class="form-control" required pattern="[6-9][0-9]{9}" title="10-digit Indian mobile number">
                </div>
                <div class="col-md-6">
                    <label class="form-label small">Email</label>
                    <input id="pEmail" class="form-control" disabled>
                </div>
                <div class="col-12">
                    <button id="profileBtn" data-label="Save changes" class="btn text-white" style="background:var(--primary)">Save changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Addresses -->
    <div class="card border-0 shadow-sm mb-4" id="addresses">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="fw-bold mb-0"><i class="bi bi-geo-alt me-2"></i>Saved addresses</h6>
                <button class="btn btn-sm btn-outline-warning" onclick="openAddressModal()">
                    <i class="bi bi-plus-lg me-1"></i>Add address
                </button>
            </div>
            <div id="addressList"><div class="text-center py-3"><div class="spinner-border text-warning"></div></div></div>
        </div>
    </div>

    <!-- Password -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <h6 class="fw-bold mb-3"><i class="bi bi-shield-lock me-2"></i>Change password</h6>
            <form id="passwordForm" class="row g-3">
                <div class="col-md-6">
                    <label class="form-label small">Current password</label>
                    <input id="curPw" type="password" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label small">New password</label>
                    <input id="newPw" type="password" class="form-control" required minlength="8">
                    <div class="form-text">Min 8 chars with an uppercase letter, a digit and one of !@#$%^&amp;*</div>
                </div>
                <div class="col-12">
                    <button id="pwBtn" data-label="Update password" class="btn btn-outline-secondary">Update password</button>
                </div>
            </form>
        </div>
    </div>

    <a href="index.html" class="btn btn-link">&larr; Back to restaurants</a>
</div>

<!-- Address modal -->
<div class="modal fade" id="addressModal" tabindex="-1">
    <div class="modal-dialog">
        <form class="modal-content" id="addressForm">
            <div class="modal-header">
                <h5 class="modal-title" id="addressModalTitle">Add address</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body row g-3">
                <div class="col-12">
                    <label class="form-label small">Label (Home, Work…)</label>
                    <input id="aLabel" class="form-control" maxlength="50" value="Home">
                </div>
                <div class="col-12">
                    <label class="form-label small">Address</label>
                    <input id="aLine" class="form-control" required maxlength="300">
                </div>
                <div class="col-md-5">
                    <label class="form-label small">City</label>
                    <input id="aCity" class="form-control" required maxlength="100">
                </div>
                <div class="col-md-4">
                    <label class="form-label small">State</label>
                    <input id="aState" class="form-control" required maxlength="100">
                </div>
                <div class="col-md-3">
                    <label class="form-label small">Pincode</label>
                    <input id="aPin" class="form-control" required pattern="[1-9][0-9]{5}" title="6-digit pincode">
                </div>
                <div class="col-12 form-check ms-2">
                    <input class="form-check-input" type="checkbox" id="aDefault">
                    <label class="form-check-label small" for="aDefault">Make this my default address</label>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                <button class="btn text-white" style="background:var(--primary)">Save</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
    if (!Auth.isLoggedIn()) location.href = 'login.html';

    const addressModal = new bootstrap.Modal(document.getElementById('addressModal'));
    let addresses = [], editingId = null;

    const msg = r => r?.data?.message || 'Something went wrong';
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    async function loadProfile() {
        const res = await apiFetch('/users/me');
        if (!res?.ok) return showAlert('alertBox', msg(res));
        const u = res.data.data;
        pName.value = u.name; pPhone.value = u.phone; pEmail.value = u.email;
    }

    async function loadAddresses() {
        const res = await apiFetch('/users/me/addresses');
        if (!res?.ok) { addressList.innerHTML = ''; return showAlert('alertBox', msg(res)); }
        addresses = res.data.data;
        addressList.innerHTML = addresses.length ? addresses.map(a => `
            <div class="d-flex justify-content-between align-items-start border rounded p-3 mb-2">
                <div>
                    <strong>${esc(a.label || 'Address')}</strong>
                    ${a.defaultAddress ? '<span class="badge bg-success ms-2">Default</span>' : ''}
                    <div class="small text-muted">${esc(a.addressLine)}, ${esc(a.city)}, ${esc(a.state)} ${esc(a.pincode)}</div>
                </div>
                <div class="btn-group btn-group-sm">
                    ${a.defaultAddress ? '' : `<button class="btn btn-outline-secondary" onclick="makeDefault(${a.id})">Set default</button>`}
                    <button class="btn btn-outline-secondary" onclick="openAddressModal(${a.id})"><i class="bi bi-pencil"></i></button>
                    <button class="btn btn-outline-danger" onclick="deleteAddress(${a.id})"><i class="bi bi-trash"></i></button>
                </div>
            </div>`).join('')
            : '<p class="text-muted small mb-0">No saved addresses yet. Add one to place orders.</p>';
    }

    function openAddressModal(id) {
        editingId = id || null;
        const a = addresses.find(x => x.id === id) || {};
        addressModalTitle.textContent = id ? 'Edit address' : 'Add address';
        aLabel.value = a.label ?? 'Home'; aLine.value = a.addressLine ?? ''; aCity.value = a.city ?? '';
        aState.value = a.state ?? ''; aPin.value = a.pincode ?? '';
        aDefault.checked = id ? !!a.defaultAddress : addresses.length === 0;
        addressModal.show();
    }

    addressForm.addEventListener('submit', async e => {
        e.preventDefault();
        const body = { label: aLabel.value.trim(), addressLine: aLine.value.trim(), city: aCity.value.trim(),
                       state: aState.value.trim(), pincode: aPin.value.trim(), defaultAddress: aDefault.checked };
        const res = await apiFetch(editingId ? `/users/me/addresses/${editingId}` : '/users/me/addresses',
                                   { method: editingId ? 'PUT' : 'POST', body: JSON.stringify(body) });
        if (res?.ok) { addressModal.hide(); showAlert('alertBox', 'Address saved', 'success'); loadAddresses(); }
        else showAlert('alertBox', msg(res));
    });

    async function makeDefault(id) {
        const res = await apiFetch(`/users/me/addresses/${id}/default`, { method: 'PATCH' });
        res?.ok ? loadAddresses() : showAlert('alertBox', msg(res));
    }

    async function deleteAddress(id) {
        if (!confirm('Delete this address?')) return;
        const res = await apiFetch(`/users/me/addresses/${id}`, { method: 'DELETE' });
        res?.ok ? loadAddresses() : showAlert('alertBox', msg(res));
    }

    profileForm.addEventListener('submit', async e => {
        e.preventDefault();
        setLoading('profileBtn', true);
        const res = await apiFetch('/users/me', { method: 'PUT',
            body: JSON.stringify({ name: pName.value.trim(), phone: pPhone.value.trim() }) });
        setLoading('profileBtn', false);
        if (res?.ok) { localStorage.setItem('userName', pName.value.trim()); showAlert('alertBox', 'Profile updated', 'success'); }
        else showAlert('alertBox', msg(res));
    });

    passwordForm.addEventListener('submit', async e => {
        e.preventDefault();
        setLoading('pwBtn', true);
        const res = await apiFetch('/users/me/password', { method: 'PUT',
            body: JSON.stringify({ currentPassword: curPw.value, newPassword: newPw.value }) });
        setLoading('pwBtn', false);
        if (res?.ok) { passwordForm.reset(); showAlert('alertBox', 'Password updated', 'success'); }
        else showAlert('alertBox', msg(res));
    });

    loadProfile(); loadAddresses();
    if (location.hash === '#addresses') document.getElementById('addresses').scrollIntoView();
</script>
</body>
</html>
