<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Placed — FoodExpress</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="success-wrap">
    <div class="success-card">
        <div class="success-badge"><i class="bi bi-check-lg"></i></div>
        <h2>Order placed</h2>
        <p class="text-muted mb-1" id="orderInfo">Your order is being confirmed by the restaurant.</p>
        <p class="small text-muted">We’ll update the status as soon as the kitchen starts cooking.</p>
        <div class="d-flex flex-wrap gap-2 justify-content-center mt-4">
            <a href="orders.html" class="btn btn-lime px-4">Track order</a>
            <a href="index.html" class="btn btn-outline-secondary px-4">Order something else</a>
        </div>
    </div>
</div>
<script src="js/app.js"></script>
<script>
    const params = new URLSearchParams(location.search);
    const orderId = params.get('id');
    if (orderId) {
        apiFetch(`/orders/${orderId}`).then(res => {
            if (res?.ok) {
                const o = res.data.data;
                document.getElementById('orderInfo').textContent =
                    `Order #${o.orderNumber} from ${o.restaurantName} — ₹${o.totalAmount}`;
            }
        });
    }
</script>
</body>
</html>
