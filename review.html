<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate your order — FoodExpress</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" style="color:var(--primary)" href="index.html"><img class="brand-logo" src="images/foodexpress-logo.svg" alt=""> <span>FoodExpress</span></a>
        <span class="fw-semibold">Rate your order</span>
    </div>
</nav>

<div class="container my-4" style="max-width:560px">
    <div id="alertBox" style="display:none" class="mb-3"></div>
    <div class="card border-0 shadow-sm">
        <div class="card-body text-center">
            <h5 class="fw-bold mb-1" id="restName">How was your order?</h5>
            <p class="text-muted small" id="orderRef"></p>
            <div class="stars my-3" id="stars">
                <i class="bi bi-star-fill" data-v="1"></i><i class="bi bi-star-fill" data-v="2"></i><i class="bi bi-star-fill" data-v="3"></i><i class="bi bi-star-fill" data-v="4"></i><i class="bi bi-star-fill" data-v="5"></i>
            </div>
            <textarea id="comment" class="form-control mb-3" rows="4" maxlength="1000" placeholder="Tell others about the food and delivery (optional)"></textarea>
            <button id="submitBtn" data-label="Submit review" class="btn text-white w-100" style="background:var(--primary)">Submit review</button>
        </div>
    </div>
    <div class="text-center mt-3"><a href="orders.html">&larr; Back to my orders</a></div>
</div>

<script src="js/app.js"></script>
<script>
    if (!Auth.isLoggedIn()) location.href = 'login.html';

    const orderId = new URLSearchParams(location.search).get('orderId');
    let rating = 0;

    if (!orderId) location.href = 'orders.html';

    const paint = n => document.querySelectorAll('#stars i').forEach(i => i.classList.toggle('on', +i.dataset.v <= n));
    document.querySelectorAll('#stars i').forEach(i => {
        i.addEventListener('mouseenter', () => paint(+i.dataset.v));
        i.addEventListener('mouseleave', () => paint(rating));
        i.addEventListener('click', () => { rating = +i.dataset.v; paint(rating); });
    });

    (async () => {
        const res = await apiFetch(`/orders/${orderId}`);
        if (res?.ok) {
            const o = res.data.data;
            if (o.restaurantName) restName.textContent = o.restaurantName;
            orderRef.textContent = `Order #${o.id}`;
        }
    })();

    submitBtn.addEventListener('click', async () => {
        if (!rating) return showAlert('alertBox', 'Please choose a star rating');
        setLoading('submitBtn', true);
        const res = await apiFetch('/reviews', { method: 'POST',
            body: JSON.stringify({ orderId: +orderId, rating, comment: comment.value.trim() }) });
        setLoading('submitBtn', false);
        if (res?.ok) {
            showAlert('alertBox', 'Thanks for your review!', 'success');
            setTimeout(() => location.href = 'orders.html', 1000);
        } else showAlert('alertBox', res?.data?.message || 'Could not submit review');
    });
</script>
</body>
</html>
