services:
  mysql:
    image: mysql:8.0
    container_name: fd-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root123}
      MYSQL_DATABASE: food_delivery_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-root123}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: fd-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/food_delivery_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root123}
      JWT_SECRET: ${JWT_SECRET:-5A7134743777217A25432A462D4A614E645267556B58703273357638792F423F}
      PAYMENT_DEMO: ${PAYMENT_DEMO:-true}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_your_key_id}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-your_razorpay_secret}
      MAIL_USERNAME: ${MAIL_USERNAME:-your@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-your_app_password}
    ports:
      - "8080:8080"

  frontend:
    image: nginx:alpine
    container_name: fd-frontend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "3000:80"

volumes:
  mysql_data:
