<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders — FoodExpress</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" style="color:var(--primary)" href="index.html"><img class="brand-logo" src="images/foodexpress-logo.svg" alt=""> <span>FoodExpress</span></a>
        <span class="fw-semibold">My Orders</span>
    </div>
</nav>

<div class="container my-4" style="max-width:800px">
    <div id="ordersList">
        <div class="text-center py-5"><div class="spinner-border text-warning"></div></div>
    </div>
    <div class="text-center mt-3" id="loadMoreBtn" style="display:none">
        <button class="btn btn-outline-warning" onclick="loadOrders(false)">Load More</button>
    </div>
</div>

<!-- Order Detail Modal -->
<div class="modal fade" id="orderModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Order Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="orderModalBody"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
    if (!Auth.isLoggedIn()) location.href = 'login.html';

    let page = 0, isLast = false;
    const orderModal = new bootstrap.Modal(document.getElementById('orderModal'));

    document.addEventListener('DOMContentLoaded', () => loadOrders(true));

    async function loadOrders(reset) {
        if (reset) { page = 0; document.getElementById('ordersList').innerHTML = ''; }
        const res = await apiFetch(`/orders?page=${page}&size=10`);
        if (!res?.ok) return;
        const data = res.data.data;
        isLast = data.last;
        document.getElementById('loadMoreBtn').style.display = isLast ? 'none' : 'block';
        renderOrders(data.content);
        page++;
    }

    function renderOrders(orders) {
        const list = document.getElementById('ordersList');
        if (!orders.length && page === 0) {
            list.innerHTML = `<div class="text-center py-5 text-muted">
                <i class="bi bi-bag-x fs-1"></i><p class="mt-2">No orders yet</p>
                <a href="index.html" class="btn" style="background:var(--primary);color:#fff">Order Now</a>
            </div>`;
            return;
        }
        orders.forEach(o => {
            list.innerHTML += `
            <div class="card border-0 shadow-sm mb-3 p-3">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <h6 class="fw-bold mb-0">${o.restaurantName}</h6>
                        <small class="text-muted">#${o.orderNumber} • ${new Date(o.createdAt).toLocaleDateString()}</small>
                    </div>
                    <span class="status-badge status-${o.status}">${o.status.replace(/_/g,' ')}</span>
                </div>
                <div class="mt-2 text-muted small">
                    ${o.items.map(i => `${i.name} x${i.quantity}`).join(', ')}
                </div>
                <div class="d-flex justify-content-between align-items-center mt-2">
                    <span class="fw-bold">₹${o.totalAmount}</span>
                    <div class="d-flex gap-2">
                        ${o.status === 'PLACED' || o.status === 'CONFIRMED' ?
                            `<button class="btn btn-sm btn-outline-danger" onclick="cancelOrder(${o.id})">Cancel</button>` : ''}
                        ${o.status === 'DELIVERED' ?
                            `<button class="btn btn-sm btn-outline-warning" onclick="reviewOrder(${o.id})">Review</button>` : ''}
                        <button class="btn btn-sm btn-outline-secondary" onclick="viewOrder(${o.id})">Details</button>
                    </div>
                </div>
            </div>`;
        });
    }

    async function viewOrder(id) {
        const res = await apiFetch(`/orders/${id}`);
        if (!res?.ok) return;
        const o = res.data.data;
        document.getElementById('orderModalBody').innerHTML = `
            <div class="mb-3">
                <strong>Order #${o.orderNumber}</strong> — ${o.restaurantName}<br>
                <small class="text-muted">${o.deliveryAddress}</small>
            </div>
            <table class="table table-sm">
                <thead><tr><th>Item</th><th>Qty</th><th>Price</th></tr></thead>
                <tbody>${o.items.map(i => `<tr><td>${i.name}</td><td>${i.quantity}</td><td>₹${i.totalPrice}</td></tr>`).join('')}</tbody>
            </table>
            <div class="d-flex justify-content-between"><span>Subtotal</span><span>₹${o.subtotal}</span></div>
            <div class="d-flex justify-content-between"><span>Delivery</span><span>₹${o.deliveryCharge}</span></div>
            <div class="d-flex justify-content-between"><span>Tax</span><span>₹${o.taxAmount}</span></div>
            ${o.discountAmount > 0 ? `<div class="d-flex justify-content-between text-success"><span>Discount</span><span>−₹${o.discountAmount}</span></div>` : ''}
            <div class="d-flex justify-content-between fw-bold border-top pt-2"><span>Total</span><span>₹${o.totalAmount}</span></div>
            <hr>
            <h6 class="fw-bold">Status Timeline</h6>
            ${o.statusHistory.map(h => `
            <div class="d-flex gap-2 mb-2">
                <div class="d-flex flex-column align-items-center">
                    <div class="timeline-dot"></div>
                    <div class="timeline-line"></div>
                </div>
                <div><strong>${h.status.replace(/_/g,' ')}</strong><br>
                    <small class="text-muted">${h.note || ''} • ${new Date(h.changedAt).toLocaleString()}</small>
                </div>
            </div>`).join('')}`;
        orderModal.show();
    }

    async function cancelOrder(id) {
        if (!confirm('Cancel this order?')) return;
        const res = await apiFetch(`/orders/${id}/cancel`, { method: 'PATCH' });
        if (res?.ok) loadOrders(true);
    }

    function reviewOrder(id) { location.href = `review.html?orderId=${id}`; }
</script>
</body>
</html>
