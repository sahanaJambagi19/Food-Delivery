<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart & Checkout — FoodExpress</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" style="color:var(--primary)" href="index.html"><img class="brand-logo" src="images/foodexpress-logo.svg" alt=""> <span>FoodExpress</span></a>
        <span class="fw-semibold">Checkout</span>
    </div>
</nav>

<div class="container my-4">
    <div id="alertBox" class="alert-custom"></div>
    <div class="row g-4" id="checkoutContent">
        <div class="col-12 text-center py-5"><div class="spinner-border text-warning"></div></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
    if (!Auth.isLoggedIn()) location.href = 'login.html';

    let cart = null, addresses = [], selectedAddressId = null;
    let couponData = null, paymentMethod = 'ONLINE';

    document.addEventListener('DOMContentLoaded', async () => {
        await Promise.all([loadCart(), loadAddresses()]);
        render();
    });

    async function loadCart() {
        const res = await apiFetch('/cart');
        if (res?.ok) cart = res.data.data;
    }

    async function loadAddresses() {
        const res = await apiFetch('/users/me/addresses');
        if (res?.ok) {
            addresses = res.data.data;
            const def = addresses.find(a => a.defaultAddress);
            if (def) selectedAddressId = def.id;
        }
    }

    function render() {
        if (!cart || cart.totalItems === 0) {
            document.getElementById('checkoutContent').innerHTML = `
                <div class="col-12 text-center py-5">
                    <i class="bi bi-cart-x fs-1 text-muted"></i>
                    <p class="mt-2 text-muted">Your cart is empty</p>
                    <a href="index.html" class="btn" style="background:var(--primary);color:#fff">Browse Restaurants</a>
                </div>`;
            return;
        }

        const subtotal = parseFloat(cart.subtotal);
        const delivery = 30; // will come from restaurant
        const tax = +(subtotal * 0.05).toFixed(2);
        const discount = couponData ? parseFloat(couponData.discountAmount) : 0;
        const total = +(subtotal + delivery + tax - discount).toFixed(2);

        document.getElementById('checkoutContent').innerHTML = `
        <div class="col-lg-7">
            <div class="card border-0 shadow-sm p-3 mb-3">
                <h6 class="fw-bold mb-3">🛒 Order Items (${cart.restaurantName})</h6>
                ${cart.items.map(i => `
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <div class="d-flex align-items-center gap-2">
                        <span class="text-muted">${i.foodItemName}</span>
                        <div class="d-flex align-items-center gap-1">
                            <button class="qty-btn" onclick="updateQty(${i.cartItemId}, ${i.quantity - 1})">−</button>
                            <span class="fw-semibold">${i.quantity}</span>
                            <button class="qty-btn" onclick="updateQty(${i.cartItemId}, ${i.quantity + 1})">+</button>
                        </div>
                    </div>
                    <span class="fw-semibold">₹${i.subtotal}</span>
                </div>`).join('')}
            </div>

            <div class="card border-0 shadow-sm p-3 mb-3">
                <h6 class="fw-bold mb-3">📍 Delivery Address</h6>
                ${addresses.length ? addresses.map(a => `
                <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="address" value="${a.id}"
                           ${a.id === selectedAddressId ? 'checked' : ''}
                           onchange="selectedAddressId=${a.id}">
                    <label class="form-check-label">
                        <strong>${a.label}</strong> — ${a.addressLine}, ${a.city} ${a.pincode}
                    </label>
                </div>`).join('') : '<p class="text-muted small">No addresses saved.</p>'}
                <button class="btn btn-sm btn-outline-secondary mt-2" onclick="addNewAddress()">
                    <i class="bi bi-plus me-1"></i>Add New Address
                </button>
            </div>

            <div class="card border-0 shadow-sm p-3 mb-3">
                <h6 class="fw-bold mb-3">🏷️ Coupon</h6>
                <div class="input-group">
                    <input type="text" id="couponInput" class="form-control" placeholder="Enter coupon code">
                    <button class="btn btn-outline-warning" onclick="applyCoupon()">Apply</button>
                </div>
                <div id="couponMsg" class="mt-2 small"></div>
            </div>

            <div class="card border-0 shadow-sm p-3">
                <h6 class="fw-bold mb-3">💳 Payment Method</h6>
                <div class="d-flex gap-3">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="payment" value="ONLINE"
                               checked onchange="paymentMethod='ONLINE'">
                        <label class="form-check-label">Online (Razorpay)</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="payment" value="COD"
                               onchange="paymentMethod='COD'">
                        <label class="form-check-label">Cash on Delivery</label>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="card border-0 shadow-sm p-3 sticky-top" style="top:80px">
                <h6 class="fw-bold mb-3">Bill Summary</h6>
                <div class="d-flex justify-content-between mb-1"><span>Subtotal</span><span>₹${subtotal}</span></div>
                <div class="d-flex justify-content-between mb-1"><span>Delivery</span><span>₹${delivery}</span></div>
                <div class="d-flex justify-content-between mb-1"><span>Tax (5%)</span><span>₹${tax}</span></div>
                ${discount > 0 ? `<div class="d-flex justify-content-between mb-1 text-success">
                    <span>Discount</span><span>−₹${discount}</span></div>` : ''}
                <hr>
                <div class="d-flex justify-content-between fw-bold fs-5">
                    <span>Total</span><span>₹${total}</span>
                </div>
                <button id="placeOrderBtn" class="btn w-100 mt-3 fw-semibold"
                        style="background:var(--primary);color:#fff" onclick="placeOrder()"
                        data-label="Place Order">
                    Place Order
                </button>
            </div>
        </div>`;
    }

    async function updateQty(cartItemId, qty) {
        const res = await apiFetch(`/cart/items/${cartItemId}?quantity=${qty}`, { method: 'PUT' });
        if (res?.ok) { cart = res.data.data; render(); }
    }

    async function applyCoupon() {
        const code = document.getElementById('couponInput').value.trim();
        if (!code) return;
        const res = await apiFetch(`/coupons/validate?code=${code}&orderAmount=${cart.subtotal}`);
        const msg = document.getElementById('couponMsg');
        if (res?.ok) {
            couponData = res.data.data;
            msg.innerHTML = `<span class="text-success"><i class="bi bi-check-circle me-1"></i>
                Coupon applied! You save ₹${couponData.discountAmount}</span>`;
            render();
        } else {
            couponData = null;
            msg.innerHTML = `<span class="text-danger">${res?.data?.message || 'Invalid coupon'}</span>`;
        }
    }

    async function placeOrder() {
        if (!selectedAddressId) { showAlert('alertBox', 'Please select a delivery address'); return; }
        setLoading('placeOrderBtn', true);
        const body = {
            addressId: selectedAddressId,
            paymentMethod,
            couponCode: couponData?.code || null
        };
        const res = await apiFetch('/orders', { method: 'POST', body: JSON.stringify(body) });
        setLoading('placeOrderBtn', false);
        if (!res?.ok) { showAlert('alertBox', res?.data?.message || 'Failed to place order'); return; }

        const order = res.data.data;
        if (paymentMethod === 'ONLINE') {
            location.href = `payment.html?orderId=${order.id}`;
        } else {
            location.href = `order-success.html?id=${order.id}`;
        }
    }

    function addNewAddress() { location.href = 'profile.html#addresses'; }
</script>
</body>
</html>
