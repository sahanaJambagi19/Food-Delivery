<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Dashboard — FoodExpress</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-light bg-white shadow-sm">
    <div class="container">
        <span class="navbar-brand fw-bold" style="color:var(--primary)">🚴 Delivery Partner</span>
        <div class="d-flex gap-2 align-items-center">
            <span id="availabilityBadge" class="badge bg-secondary">Offline</span>
            <button class="btn btn-sm btn-outline-secondary" onclick="toggleAvailability()">Toggle Status</button>
            <button class="btn btn-sm btn-outline-danger" onclick="logout()">Logout</button>
        </div>
    </div>
</nav>

<div class="container my-4" style="max-width:700px">
    <div id="alertBox" class="alert-custom"></div>
    <div class="d-flex justify-content-between mb-3">
        <h5 class="fw-bold mb-0">My Deliveries</h5>
        <button class="btn btn-sm btn-outline-secondary" onclick="loadAssignments()">
            <i class="bi bi-arrow-clockwise"></i> Refresh
        </button>
    </div>
    <div id="assignmentsList">
        <div class="text-center py-5"><div class="spinner-border text-warning"></div></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/app.js"></script>
<script>
    if (!Auth.isLoggedIn() || Auth.getRole() !== 'DELIVERY_PARTNER') location.href = '../login.html';

    document.addEventListener('DOMContentLoaded', loadAssignments);

    async function loadAssignments() {
        const [res, availabilityRes] = await Promise.all([
            apiFetch('/delivery/assignments'),
            apiFetch('/delivery/availability')
        ]);
        if (availabilityRes?.ok) {
            const isOnline = availabilityRes.data.data === true;
            const badge = document.getElementById('availabilityBadge');
            badge.textContent = isOnline ? 'Online' : 'Offline';
            badge.className = 'badge ' + (isOnline ? 'bg-success' : 'bg-secondary');
        }
        if (!res?.ok) return;
        const list = res.data.data;
        const el = document.getElementById('assignmentsList');
        if (!list.length) {
            el.innerHTML = '<div class="text-center py-5 text-muted"><i class="bi bi-bicycle fs-1"></i><p class="mt-2">No assignments yet</p></div>';
            return;
        }
        el.innerHTML = list.map(a => `
        <div class="card border-0 shadow-sm mb-3 p-3">
            <div class="d-flex justify-content-between mb-2">
                <strong>#${a.orderNumber}</strong>
                <span class="badge bg-secondary">${a.status}</span>
            </div>
            <div class="small text-muted mb-1">
                <i class="bi bi-shop me-1"></i><strong>Pickup:</strong> ${a.restaurantName} — ${a.restaurantAddress}
            </div>
            <div class="small text-muted mb-2">
                <i class="bi bi-geo-alt me-1"></i><strong>Deliver to:</strong> ${a.customerName} — ${a.deliveryAddress}
            </div>
            <div class="d-flex justify-content-between align-items-center">
                <span class="fw-bold">₹${a.totalAmount} <small class="text-muted">(Fee: ₹${a.deliveryFee})</small></span>
                <div class="d-flex gap-2">
                    ${a.status === 'ASSIGNED' ? `
                        <button class="btn btn-sm btn-primary" onclick="updateStatus(${a.assignmentId},'PICKED_UP')">
                            Picked Up
                        </button>` : ''}
                    ${a.status === 'PICKED_UP' ? `
                        <button class="btn btn-sm btn-warning" onclick="updateStatus(${a.assignmentId},'OUT_FOR_DELIVERY')">
                            Out for Delivery
                        </button>` : ''}
                    ${a.status === 'OUT_FOR_DELIVERY' ? `
                        <button class="btn btn-sm btn-success" onclick="updateStatus(${a.assignmentId},'DELIVERED')">
                            Mark Delivered
                        </button>` : ''}
                </div>
            </div>
        </div>`).join('');
    }

    async function updateStatus(id, status) {
        const res = await apiFetch(`/delivery/assignments/${id}/status?status=${status}`, { method: 'PATCH' });
        if (res?.ok) loadAssignments();
        else showAlert('alertBox', res?.data?.message || 'Failed to update');
    }

    async function toggleAvailability() {
        const res = await apiFetch('/delivery/availability', { method: 'PATCH' });
        if (res?.ok) {
            const badge = document.getElementById('availabilityBadge');
            const isOnline = badge.textContent === 'Offline';
            badge.textContent = isOnline ? 'Online' : 'Offline';
            badge.className = 'badge ' + (isOnline ? 'bg-success' : 'bg-secondary');
        }
    }

    function logout() { Auth.clear(); location.href = '../login.html'; }
</script>
</body>
</html>
