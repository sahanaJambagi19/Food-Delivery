# ===== Server =====
server.port=8080
server.servlet.context-path=/api

# ===== MySQL =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/food_delivery_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===== JWT =====
app.jwt.secret=${JWT_SECRET:5A7134743777217A25432A462D4A614E645267556B58703273357638792F423F}
app.jwt.access-token-expiration=${JWT_ACCESS_EXP:86400000}
app.jwt.refresh-token-expiration=${JWT_REFRESH_EXP:604800000}

# ===== Razorpay =====
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_your_key_id}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:your_razorpay_secret}
# Demo mode: online payments are simulated (no Razorpay keys needed). Set PAYMENT_DEMO=false in production.
app.payment.demo-mode=${PAYMENT_DEMO:true}

# ===== Mail =====
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===== File Upload =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${UPLOAD_DIR:uploads}

# ===== Springdoc =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===== Logging =====
logging.level.com.fooddelivery=INFO
logging.level.org.springframework.security=WARN
