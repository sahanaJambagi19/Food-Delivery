<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — FoodExpress</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrapper">
    <aside class="auth-art" aria-hidden="true">
        <h2>Join FoodExpress. Order from hand-picked kitchens, or start serving your own.</h2>
        <p>Create a free account as a customer, a restaurant owner or a delivery partner.</p>
    </aside>
    <div class="auth-pane">
    <div class="auth-card">
        <div class="auth-logo"><img class="auth-brand-logo" src="images/foodexpress-logo.svg" alt=""> <span>FoodExpress</span></div>
        <p class="auth-subtitle">Create your account</p>

        <div id="alertBox" class="alert-custom"></div>

        <!-- Role Selector -->
        <div class="mb-3">
            <label class="form-label fw-semibold">I am a</label>
            <div class="role-selector" id="roleSelector">
                <div class="role-btn active" data-role="CUSTOMER" onclick="selectRole(this)">
                    🛒 Customer
                </div>
                <div class="role-btn" data-role="RESTAURANT_OWNER" onclick="selectRole(this)">
                    🍽️ Restaurant Owner
                </div>
                <div class="role-btn" data-role="DELIVERY_PARTNER" onclick="selectRole(this)">
                    🚴 Delivery Partner
                </div>
            </div>
        </div>

        <form id="registerForm" novalidate>
            <div class="mb-3">
                <label class="form-label fw-semibold">Full Name</label>
                <input type="text" id="name" class="form-control" placeholder="John Doe" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Mobile Number</label>
                <div class="input-group">
                    <span class="input-group-text">+91</span>
                    <input type="tel" id="phone" class="form-control" placeholder="9876543210"
                           maxlength="10" pattern="[6-9]\d{9}" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <div class="input-group">
                    <input type="password" id="password" class="form-control"
                           placeholder="Min 8 chars, 1 uppercase, 1 digit, 1 special" required
                           oninput="checkStrength(this.value)">
                    <span class="input-group-text toggle-pwd" onclick="togglePwd('password','eye1')">
                        <i class="bi bi-eye" id="eye1"></i>
                    </span>
                </div>
                <div id="strengthBar" class="mt-1" style="height:4px;border-radius:2px;transition:all .3s"></div>
                <small id="strengthText" class="text-muted"></small>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Confirm Password</label>
                <div class="input-group">
                    <input type="password" id="confirmPassword" class="form-control"
                           placeholder="Re-enter password" required>
                    <span class="input-group-text toggle-pwd" onclick="togglePwd('confirmPassword','eye2')">
                        <i class="bi bi-eye" id="eye2"></i>
                    </span>
                </div>
            </div>

            <button type="submit" id="registerBtn" class="btn-primary-custom" data-label="Create Account">
                Create Account
            </button>
        </form>

        <p class="text-center mt-3" style="font-size:0.9rem">
            Already have an account?
            <a href="login.html" class="text-decoration-none fw-semibold" style="color:var(--primary)">Sign In</a>
        </p>
    </div>
    </div>
</div>

<script src="js/app.js"></script>
<script>
    if (Auth.isLoggedIn()) Auth.redirectByRole();

    let selectedRole = 'CUSTOMER';

    function selectRole(el) {
        document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        selectedRole = el.dataset.role;
    }

    function togglePwd(id, iconId) {
        const el = document.getElementById(id);
        const icon = document.getElementById(iconId);
        if (el.type === 'password') { el.type = 'text'; icon.className = 'bi bi-eye-slash'; }
        else { el.type = 'password'; icon.className = 'bi bi-eye'; }
    }

    function checkStrength(val) {
        const bar = document.getElementById('strengthBar');
        const txt = document.getElementById('strengthText');
        let score = 0;
        if (val.length >= 8) score++;
        if (/[A-Z]/.test(val)) score++;
        if (/[0-9]/.test(val)) score++;
        if (/[!@#$%^&*]/.test(val)) score++;
        const levels = [
            { color: '#e74c3c', label: 'Weak',      width: '25%' },
            { color: '#e67e22', label: 'Fair',      width: '50%' },
            { color: '#f1c40f', label: 'Good',      width: '75%' },
            { color: '#27ae60', label: 'Strong',    width: '100%' }
        ];
        const l = levels[Math.max(0, score - 1)] || levels[0];
        bar.style.background = l.color;
        bar.style.width = val ? l.width : '0';
        txt.textContent = val ? l.label : '';
        txt.style.color = l.color;
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name     = document.getElementById('name').value.trim();
        const email    = document.getElementById('email').value.trim();
        const phone    = document.getElementById('phone').value.trim();
        const password = document.getElementById('password').value;
        const confirm  = document.getElementById('confirmPassword').value;

        if (!name || !email || !phone || !password) {
            showAlert('alertBox', 'All fields are required.'); return;
        }
        if (!/^[6-9]\d{9}$/.test(phone)) {
            showAlert('alertBox', 'Enter a valid 10-digit Indian mobile number.'); return;
        }
        if (password !== confirm) {
            showAlert('alertBox', 'Passwords do not match.'); return;
        }

        setLoading('registerBtn', true);
        const res = await apiFetch('/auth/register', {
            method: 'POST',
            body: JSON.stringify({ name, email, phone, password, role: selectedRole })
        });
        setLoading('registerBtn', false);

        if (res?.ok) {
            Auth.save(res.data.data);
            showAlert('alertBox', 'Account created! Redirecting...', 'success');
            setTimeout(() => Auth.redirectByRole(), 800);
        } else {
            showAlert('alertBox', res?.data?.message || 'Registration failed. Try again.');
        }
    });
</script>
</body>
</html>
